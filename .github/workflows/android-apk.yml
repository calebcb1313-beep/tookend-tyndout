name: Build Tookend Tyndout APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

env:
  RELEASE_TAG: v0.3.2
  APK_NAME: Tookend-Tyndout-0.3.2.apk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Java
        id: java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu-latest image ships the Android SDK; only add packages if the
      # exact platform/build-tools this project needs are missing.
      - name: Prepare Android SDK
        id: sdk
        run: |
          set -o pipefail
          chmod +x gradlew
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "Have platforms: $(ls "$ANDROID_HOME/platforms" 2>/dev/null | tr '\n' ' ')"
          echo "Have build-tools: $(ls "$ANDROID_HOME/build-tools" 2>/dev/null | tr '\n' ' ')"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" --install "platforms;android-35" "build-tools;35.0.0" 2>&1 | tee sdk-install.log
          fi

      - name: Build signed release APK
        id: build
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleRelease --console=plain 2>&1 | tee build.log

      - name: Name the APK for release
        id: name
        run: cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"

      - name: Verify APK signature
        id: apksigner
        run: |
          set -o pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK_NAME" 2>&1 | tee apksigner.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tookend-Tyndout-release-apk
          path: ${{ env.APK_NAME }}
          if-no-files-found: error

      - name: Publish GitHub release with APK
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Tookend Tyndout ${{ env.RELEASE_TAG }}
          body: |
            TOOKEND TYNDOUT: The Rootbound Rebellion

            Android build 0.3.2 (versionCode 4) — installable release APK.

            New: a real launcher icon (adaptive on Android 8+) instead of the blank
            default, and the same artwork in the web manifest for installs.

            Fixed: the render loop crashed on its first frame before a level existed,
            which froze the game on a static background as soon as you picked a region.
            Also ships the service worker the page was requesting, so offline play works
            when hosted.

            Install: download `${{ env.APK_NAME }}` below and open it on your device.
            Android will ask you to allow installing from this source.

            Includes the campaign (six regions plus guardian fights), endless mode,
            keyboard and touchscreen controls, and offline play inside a full-screen
            landscape WebView.
          files: ${{ env.APK_NAME }}
          fail_on_unmatched_files: true
          make_latest: true

      # Diagnostic only: if a step above failed, publish the captured output to a
      # ci-log branch so the failure is readable without repository access.
      - name: Publish diagnostics on failure
        if: failure()
        env:
          TOKEN: ${{ github.token }}
          STEP_JAVA: ${{ steps.java.outcome }}
          STEP_SDK: ${{ steps.sdk.outcome }}
          STEP_BUILD: ${{ steps.build.outcome }}
          STEP_NAME: ${{ steps.name.outcome }}
          STEP_APKSIGNER: ${{ steps.apksigner.outcome }}
          STEP_RELEASE: ${{ steps.release.outcome }}
        run: |
          {
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "Commit: ${{ github.sha }}"
            echo "java=$STEP_JAVA sdk=$STEP_SDK build=$STEP_BUILD name=$STEP_NAME apksigner=$STEP_APKSIGNER release=$STEP_RELEASE"
            if [ -n "$ANDROID_HOME" ]; then
              echo "ANDROID_HOME=$ANDROID_HOME"
              echo "platforms: $(ls "$ANDROID_HOME/platforms" 2>/dev/null | tr '\n' ' ')"
              echo "build-tools: $(ls "$ANDROID_HOME/build-tools" 2>/dev/null | tr '\n' ' ')"
            fi
            for f in sdk-install.log build.log apksigner.log; do
              if [ -f "$f" ]; then echo; echo "===== $f (tail) ====="; tail -n 120 "$f"; fi
            done
          } > ci-failure.txt 2>&1 || true
          git config user.name "tookend-ci"; git config user.email "tookend-ci@users.noreply.github.com"
          git checkout -B ci-log
          git add -f ci-failure.txt
          git commit -m "CI failure log for run ${{ github.run_id }}"
          git push --force "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" ci-log
