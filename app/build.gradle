plugins { id 'com.android.application' }

android {
    namespace 'com.tookendtyndout.rootbound'
    compileSdk 35
    defaultConfig {
        applicationId 'com.tookendtyndout.rootbound'
        minSdk 23
        targetSdk 35
        versionCode 5
        versionName '0.3.3'
    }
    signingConfigs {
        // Project signing key so every release installs as an update of the previous one.
        release {
            storeFile file('../keystore/tookend-release.jks')
            storePassword 'tookend-release'
            keyAlias 'tookend'
            keyPassword 'tookend-release'
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
